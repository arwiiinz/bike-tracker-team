      // ===== VALIDATE USERNAME =====
      function validateAndSetUsername(newName) {
        if (!newName || newName.trim() === '') {
          showToast('⚠️ Name cannot be empty.', true);
          return false;
        }
        const trimmed = newName.trim();
        if (!teamCode) return false;

        return database.ref('teams/' + teamCode)
          .orderByChild('userName')
          .equalTo(trimmed)
          .once('value')
          .then((snapshot) => {
            let taken = false;
            snapshot.forEach((childSnapshot) => {
              if (childSnapshot.key !== myUserId && childSnapshot.key !== '_meta') {
                taken = true;
              }
            });
            if (taken) {
              showToast(`❌ Username "${trimmed}" is already taken!`, true);
              $myNameInput.value = myName;
              return false;
            } else {
              myName = trimmed;
              localStorage.setItem('biketeam_myname', myName);
              updateTeamList();
              broadcastMyPosition();
              renderClusters();
              updateMyMarker();
              updateTeamActivity();
              showToast(`✅ Username set to "${myName}"`);
              return true;
            }
          }).catch(() => {
            showToast('❌ Error validating username.', true);
            return false;
          });
      }

      // ===== MAP =====
      function initMap() {
        map = new maplibregl.Map({
          container: 'map',
          center: [0, 0],
          zoom: 14,
          bearing: 0,
          pitch: 0,
          style: 'https://basemaps.cartocdn.com/gl/dark-matter-gl-style/style.json'
        });

        map.on('load', function() {
          mapInitialized = true;

          map.addControl(new maplibregl.NavigationControl({ showCompass: true }), 'top-right');

          const geolocateControl = new maplibregl.GeolocateControl({
            positionOptions: { enableHighAccuracy: true },
            trackUserLocation: true,
            showUserHeading: true,
            showAccuracyCircle: true
          });
          map.addControl(geolocateControl, 'top-right');

          map.on('dragstart', () => { followMode = false; });
          map.on('dblclick', () => {
            followMode = true;
            if (myLastPosition) {
              map.setCenter([myLastPosition.lng, myLastPosition.lat]);
            }
          });
          map.on('click', () => {
            if (window.innerWidth <= 768 && !$sidebar.classList.contains('hidden')) {
              $sidebar.classList.add('hidden');
              $sidebar.style.transform = 'translateX(-100%)';
            }
          });

          map.addSource(MY_TRAIL_SOURCE, {
            type: 'geojson',
            data: { type: 'Feature', geometry: { type: 'LineString', coordinates: [] } }
          });
          map.addLayer({
            id: MY_TRAIL_LAYER,
            type: 'line',
            source: MY_TRAIL_SOURCE,
            paint: {
              'line-color': myColor,
              'line-width': 4,
              'line-opacity': 0.7
            }
          });

          if (myLastPosition) {
            renderClusters();
            updateMyMarker();
            updateMyTrail();
          }
          if (myLastPosition && followMode) {
            map.setCenter([myLastPosition.lng, myLastPosition.lat]);
          }
        });

        map.on('error', function() {
          if (!map.getStyle()) {
            map.setStyle('https://demotiles.maplibre.org/style.json');
          }
        });
      }

      function updateMyTrail() {
        if (myRoutePoints.length < 2 || !map || !mapInitialized) return;
        const source = map.getSource(MY_TRAIL_SOURCE);
        if (source) {
          source.setData({
            type: 'Feature',
            geometry: {
              type: 'LineString',
              coordinates: myRoutePoints.map(p => [p[1], p[0]])
            }
          });
        }
      }

      // ===== GEOLOCATION =====
      function startGeolocation() {
        if (useManualLocation) return false;
        if (!navigator.geolocation) {
          showToast('⚠️ Geolocation not supported');
          return false;
        }
        geoWatchId = navigator.geolocation.watchPosition(
          (pos) => {
            const { latitude: lat, longitude: lng, speed, heading, altitude } = pos.coords;
            const speedKmh = speed != null ? speed * 3.6 : 0;
            myCurrentSpeed = speedKmh;
            myCurrentAltitude = altitude;
            const newPos = { lat, lng, speed: speedKmh, heading, altitude, timestamp: Date.now() };

            if (myLastPosition && isTracking) {
              const dist = haversineDistance(myLastPosition.lat, myLastPosition.lng, lat, lng);
              if (dist > 0.01) myTotalDistance += dist;
            }
            if (isTracking) {
              myRoutePoints.push([lat, lng]);
              if (myRoutePoints.length > MAX_TRAIL_POINTS) myRoutePoints.shift();
            }
            myLastPosition = newPos;

            updateMyStats();
            renderClusters();
            updateMyMarker();
            updateMyTrail();
            broadcastMyPosition();

            if (followMode && map) {
              map.setCenter([lng, lat]);
            }
            updateStatusIndicator(true);
          },
          (err) => {
            updateStatusIndicator(false);
            let msg = 'GPS Error';
            if (err.code === 1) msg = 'Location permission denied';
            else if (err.code === 2) msg = 'Position unavailable';
            else if (err.code === 3) msg = 'GPS timeout';
            $statusText.textContent = msg;
            $statusDot.style.background = 'var(--danger)';
            showToast(`⚠️ ${msg}. Use manual location.`);
            if (!myLastPosition && map) {
              map.setCenter([0, 0]);
            }
          },
          { enableHighAccuracy: true, timeout: 15000, maximumAge: 2000 }
        );
        return true;
      }

      function stopGeolocation() {
        if (geoWatchId != null) {
          navigator.geolocation.clearWatch(geoWatchId);
          geoWatchId = null;
        }
      }

      function updateStatusIndicator(active) {
        if (active) {
          $statusDot.style.background = 'var(--success)';
          $statusDot.style.animation = 'pulse-dot 1.8s infinite';
          $statusText.textContent = isTracking ? 'LIVE' : 'CONNECTED';
          $statusText.style.color = isTracking ? 'var(--success)' : 'var(--accent2)';
        } else {
          $statusDot.style.background = 'var(--warning)';
          $statusDot.style.animation = 'none';
          $statusText.textContent = 'NO GPS';
          $statusText.style.color = 'var(--warning)';
        }
      }

      // ===== COMPASS =====
      let isOrientationActive = false;
      let lastCompassBearing = 0;

      function updateMapBearing(bearingDeg) {
        if (map && !isNaN(bearingDeg)) {
          map.setBearing(bearingDeg);
        }
      }

      function handleDeviceOrientation(event) {
        const alpha = event.alpha;
        if (alpha !== null && !isNaN(alpha)) {
          isOrientationActive = true;
          lastCompassBearing = 360 - alpha;
          if (isTracking) {
            updateMapBearing(lastCompassBearing);
          }
        }
      }

      function initOrientation() {
        if (typeof DeviceOrientationEvent !== 'undefined') {
          if (typeof DeviceOrientationEvent.requestPermission === 'function') {
            // Silent for iOS
          } else {
            window.addEventListener('deviceorientation', handleDeviceOrientation);
            showToast('🧭 Compass active – map rotates with your phone!');
          }
        } else {
          showToast('⚠️ Compass not available.', true);
        }
      }

      // ===== HELPERS =====
      function haversineDistance(lat1, lon1, lat2, lon2) {
        const R = 6371;
        const dLat = (lat2 - lat1) * Math.PI / 180;
        const dLon = (lon2 - lon1) * Math.PI / 180;
        const a = Math.sin(dLat / 2) ** 2 + Math.cos(lat1 * Math.PI / 180) * Math.cos(lat2 * Math.PI / 180) * Math.sin(dLon /
        2) ** 2;
        return R * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1 - a));
      }

      function updateMyStats() {
        const dist = myTotalDistance;
        let elapsed = 0;
        if (isTracking && trackStartTime) elapsed = (Date.now() - trackStartTime) / 1000;
        const elapsedStr = formatDuration(elapsed);
        const altStr = myCurrentAltitude != null ? Math.round(myCurrentAltitude) : '--';
        $mySpeed.textContent = myCurrentSpeed.toFixed(1);
        $myDistance.textContent = dist.toFixed(2);
        $myElapsed.textContent = elapsedStr;
        $myAltitude.textContent = altStr;
        $miniSpeed.textContent = myCurrentSpeed.toFixed(1);
        $miniDist.textContent = dist.toFixed(2);
        $miniTime.textContent = elapsedStr;
      }

      function formatDuration(sec) {
        const h = Math.floor(sec / 3600),
          m = Math.floor((sec % 3600) / 60),
          s = Math.floor(sec % 60);
        return h > 0 ? `${h}:${String(m).padStart(2,'0')}:${String(s).padStart(2,'0')}` :
          `${String(m).padStart(2,'0')}:${String(s).padStart(2,'0')}`;
      }

      function estimateRouteDistance(pts) {
        if (!pts || pts.length < 2) return 0;
        let d = 0;
        for (let i = 1; i < pts.length; i++) d += haversineDistance(pts[i - 1][0], pts[i - 1][1], pts[i][0], pts[i][1]);
        return d;
      }

      // ============================================================
      // 🔥 FIXED: updateTeamList() no longer calls updateAdminPanel()
      // ============================================================
      function updateTeamList() {
        const members = [];
        if (myLastPosition) {
          members.push({
            id: myUserId,
            name: myName,
            color: myColor,
            speed: myCurrentSpeed,
            distance: myTotalDistance,
            isYou: true,
            isActive: isTracking || useManualLocation,
            isTracking: isTracking,
            emoji: '🚴',
            status: myStatus
          });
        }
        for (const uid in remoteUsers) {
          const u = remoteUsers[uid];
          const active = !u._offline && u.isTracking;
          const trailPts = remoteTrailPoints[uid] || [];
          members.push({
            id: uid,
            name: u.userName || 'Rider',
            color: u.color || '#888',
            speed: u.speed || 0,
            distance: estimateRouteDistance(trailPts),
            isYou: false,
            isActive: active,
            isTracking: u.isTracking,
            emoji: '🚴‍♂️',
            status: u.status || '🟢'
          });
        }

        $teamCount.textContent = members.length - 1;

        if (members.length <= 1) {
          $teamList.innerHTML =
            `<div style="color:var(--text-secondary);font-size:0.75rem;padding:20px;text-align:center;">Waiting for riders${teamCode === 'openworld' ? ' in Open World' : ` in "${teamCode}"`}...</div>`;
        } else {
          $teamList.innerHTML = members.map(m => {
            const leaderBadge = (m.id === myUserId && isLeader) ? '<span class="badge-leader">👑</span>' : '';
            return `
              <div class="member-card${m.isYou ? ' you' : ''}${!m.isActive ? ' offline' : ''}" onclick="window.highlightUser('${m.id}')">
                <div class="member-dot" style="background:${m.color};">${m.emoji}</div>
                <div class="member-info">
                  <div class="member-name">${escapeHtml(m.name)} ${m.isYou ? '<span class="badge-you">YOU</span>' : ''} ${leaderBadge} <span style="font-size:0.65rem;">${escapeHtml(m.status)}</span></div>
                  <div class="member-details"><span>⚡${m.speed.toFixed(1)} km/h</span><span>📏${m.distance.toFixed(2)} km</span></div>
                </div>
                <span class="member-status ${m.isActive ? 'status-active' : 'status-inactive'}">${m.isActive ? 'LIVE' : 'AWAY'}</span>
              </div>
            `;
          }).join('');
        }
        // ✅ No updateAdminPanel() here – panel is stable
      }

      // ===== ROUTE UI =====
      function renderRouteDropdown() {
        const selector = document.getElementById('routeSelector');
        if (!selector) return;
        const routesRef = database.ref('teams/' + teamCode + '/savedRoutes');
        routesRef.once('value').then((snap) => {
          const routes = snap.val();
          selector.innerHTML = '<option value="">-- None --</option>';
          if (routes) {
            Object.keys(routes).forEach(id => {
              const route = routes[id];
              const opt = document.createElement('option');
              opt.value = id;
              let label = route.name || 'Unnamed Route';
              if (id === activeRouteId) label += ' ✅ (Active)';
              opt.textContent = label;
              selector.appendChild(opt);
            });
          }
          if (activeRouteId && routes && routes[activeRouteId]) {
            selector.value = activeRouteId;
          } else {
            selector.value = '';
          }
        });
      }

      function renderRouteList() {
        const container = document.getElementById('routeListItems');
        if (!container) return;
        const routesRef = database.ref('teams/' + teamCode + '/savedRoutes');
        routesRef.once('value').then((snap) => {
          const routes = snap.val();
          if (!routes) {
            container.innerHTML = '<div style="color:var(--text-secondary); font-size:0.6rem;">No routes saved.</div>';
            return;
          }
          let html = '';
          Object.keys(routes).forEach(id => {
            const route = routes[id];
            const isActive = (id === activeRouteId);
            html += `
              <div class="route-list-item">
                <span>${escapeHtml(route.name || 'Unnamed')} ${isActive ? '⭐' : ''}</span>
                <button class="delete-route-btn" data-id="${id}" data-name="${escapeHtml(route.name || 'Unnamed')}">Delete</button>
              </div>
            `;
          });
          container.innerHTML = html;

          container.querySelectorAll('.delete-route-btn').forEach(btn => {
            btn.onclick = function(e) {
              e.stopPropagation();
              const id = this.dataset.id;
              const name = this.dataset.name;
              if (!confirm(`Delete route "${name}"?`)) return;
              const routeRef = database.ref('teams/' + teamCode + '/savedRoutes/' + id);
              routeRef.remove().then(() => {
                showToast(`🗑️ Route "${name}" deleted.`);
                if (activeRouteId === id) {
                  database.ref('teams/' + teamCode + '/activeRouteId').set(null);
                }
                renderRouteDropdown();
                renderRouteList();
              }).catch(() => showToast('❌ Delete failed.', true));
            };
          });
        });
      }

      // ============================================================
      // 🔥 FIXED: ADMIN PANEL – stable, rebuilt only on leader change
      // ============================================================
      function updateAdminPanel() {
        if (!teamCode) {
          $adminPanel.style.display = 'none';
          return;
        }

        if (teamCode === 'openworld') {
          $adminPanel.style.display = 'block';
          $adminPanel.innerHTML = `
            <div style="border-top:1px solid var(--border);padding-top:10px;">
              <button id="leaveTeamBtn" class="btn btn-danger btn-sm" style="width:100%;border:1px solid var(--danger);color:var(--danger);background:transparent;border-radius:20px;padding:6px;">🚪 Leave Open World</button>
            </div>
          `;
          document.getElementById('leaveTeamBtn')?.addEventListener('click', leaveTeam);
          return;
        }

        if (isLeader) {
          $adminPanel.style.display = 'block';

          let codeDisplay = 'Loading...';
          database.ref('teamCodes').orderByChild('teamCode').equalTo(teamCode).once('value').then((snap) => {
            let foundCode = '';
            snap.forEach((child) => { foundCode = child.key; });
            if (foundCode) {
              const el = document.getElementById('teamCodeDisplay');
              if (el) el.textContent = foundCode;
            }
          });

          let html = `<div class="admin-title">👑 Team Admin</div>`;
          html += `<div style="background:var(--card);padding:6px 10px;border-radius:8px;margin-bottom:8px;text-align:center;">
            <span style="color:var(--text-secondary);font-size:0.55rem;">🔑 Team Code</span><br>
            <span id="teamCodeDisplay" style="font-size:1.6rem;font-weight:bold;color:var(--accent2);letter-spacing:4px;">${codeDisplay}</span>
          </div>`;

          // ---- ROUTE UPLOAD SECTION ----
          html += `<div class="route-controls">
            <label>📂 Upload GPX (max 5)</label>
            <input type="file" id="gpxFileInput" accept=".gpx">
            <button id="uploadRouteBtn" class="btn btn-outline btn-sm" style="width:100%;margin-top:3px;">⬆️ Upload</button>
          </div>
          <div class="route-controls">
            <label>🗺️ Active Route</label>
            <select id="routeSelector"><option value="">-- None --</option></select>
          </div>
          <div style="margin-top:6px;border-top:1px solid var(--border);padding-top:6px;">
            <div style="font-size:0.6rem;color:var(--text-secondary);margin-bottom:3px;">Saved Routes:</div>
            <div id="routeListItems"></div>
          </div>`;

          // ---- START POINT CONTROLS ----
          html += `<div class="start-controls">
            <label>🏁 Start Point (manual)</label>
            <div style="display:flex; gap:6px; flex-wrap:wrap;">
              <button id="setStartBtn" class="btn btn-outline btn-sm" style="flex:1;">Set Start</button>
              <button id="clearStartBtn" class="btn btn-danger btn-sm" style="flex:1; border-color:var(--danger);color:var(--danger);">Clear Start</button>
            </div>
          </div>`;

          // Member kick list
          const members = [];
          for (const uid in remoteUsers) {
            const u = remoteUsers[uid];
            members.push({ id: uid, name: u.userName || 'Rider' });
          }
          if (members.length > 0) {
            html += `<div style="margin-top:8px;border-top:1px solid var(--border);padding-top:6px;">
              <div style="font-size:0.6rem;color:var(--text-secondary);margin-bottom:3px;">Kick members:</div>`;
            members.forEach(m => {
              html += `<div style="display:flex;justify-content:space-between;align-items:center;padding:3px 0;border-bottom:1px solid var(--border);">
                <span style="font-size:0.7rem;">${escapeHtml(m.name)}</span>
                <button class="admin-btn" data-uid="${m.id}" data-name="${escapeHtml(m.name)}">Kick</button>
              </div>`;
            });
            html += `</div>`;
          }
          html += `<div style="margin-top:8px;"><button id="deleteTeamBtn" class="btn btn-danger btn-sm" style="width:100%;border:1px solid var(--danger);color:var(--danger);background:transparent;border-radius:20px;padding:6px;">🗑️ Delete Team</button></div>`;
          $adminPanel.innerHTML = html;

          // ---- Attach events ----
          // 1. Upload button
          const uploadBtn = document.getElementById('uploadRouteBtn');
          const fileInput = document.getElementById('gpxFileInput');
          if (uploadBtn && fileInput) {
            const newBtn = uploadBtn.cloneNode(true);
            uploadBtn.parentNode.replaceChild(newBtn, uploadBtn);
            newBtn.addEventListener('click', function(e) {
              e.preventDefault();
              const input = document.getElementById('gpxFileInput');
              if (input && input.files && input.files.length > 0) {
                uploadRoute(input.files[0]);
              } else {
                showToast('Please select a GPX file first.', true);
              }
            });
          }

          // 2. Route selector
          const selector = document.getElementById('routeSelector');
          if (selector) {
            const newSelector = selector.cloneNode(true);
            selector.parentNode.replaceChild(newSelector, selector);
            newSelector.addEventListener('change', function() {
              database.ref('teams/' + teamCode + '/activeRouteId').set(this.value || null);
            });
          }

          // 3. Start point buttons (manual)
          const setStartBtn = document.getElementById('setStartBtn');
          if (setStartBtn) {
            const newSet = setStartBtn.cloneNode(true);
            setStartBtn.parentNode.replaceChild(newSet, setStartBtn);
            newSet.addEventListener('click', setStartPoint);
          }
          const clearStartBtn = document.getElementById('clearStartBtn');
          if (clearStartBtn) {
            const newClear = clearStartBtn.cloneNode(true);
            clearStartBtn.parentNode.replaceChild(newClear, clearStartBtn);
            newClear.addEventListener('click', clearStartPoint);
          }

          // 4. Kick buttons
          $adminPanel.querySelectorAll('.admin-btn').forEach(btn => {
            const newBtn = btn.cloneNode(true);
            btn.parentNode.replaceChild(newBtn, btn);
            newBtn.addEventListener('click', function(e) {
              e.stopPropagation();
              kickUser(this.dataset.uid, this.dataset.name);
            });
          });

          // 5. Delete team button
          const deleteBtn = document.getElementById('deleteTeamBtn');
          if (deleteBtn) {
            const newDelete = deleteBtn.cloneNode(true);
            deleteBtn.parentNode.replaceChild(newDelete, deleteBtn);
            newDelete.addEventListener('click', deleteTeam);
          }

          // Refresh dropdown and list after building
          renderRouteDropdown();
          renderRouteList();

        } else {
          // Regular member
          $adminPanel.style.display = 'block';
          $adminPanel.innerHTML = `
            <div style="border-top:1px solid var(--border);padding-top:10px;">
              <button id="leaveTeamBtn" class="btn btn-danger btn-sm" style="width:100%;border:1px solid var(--danger);color:var(--danger);background:transparent;border-radius:20px;padding:6px;">🚪 Leave Team</button>
            </div>
          `;
          const leaveBtn = document.getElementById('leaveTeamBtn');
          if (leaveBtn) {
            const newLeave = leaveBtn.cloneNode(true);
            leaveBtn.parentNode.replaceChild(newLeave, leaveBtn);
            newLeave.addEventListener('click', leaveTeam);
          }
        }
      }

      window.highlightUser = function(uid) {
        if (uid === myUserId && myLastPosition) {
          if (map) map.setCenter([myLastPosition.lng, myLastPosition.lat]);
          followMode = true;
          return;
        }
        const user = remoteUsers[uid];
        if (user && user.lat) {
          if (map) map.setCenter([user.lng, user.lat]);
          followMode = false;
        }
      };

      // ===== TRACKING CONTROLS =====
      function startTracking() {
        if (!myLastPosition) {
          showToast('⚠️ No location yet. Wait for GPS or set manual location.');
          return;
        }
        clearRideSession();
        isTracking = true;
        trackStartTime = Date.now();
        myTotalDistance = 0;
        myRoutePoints = [
          [myLastPosition.lat, myLastPosition.lng]
        ];
        updateMyTrail();

        if (isOrientationActive && map) {
          if (lastCompassBearing !== 0) {
            updateMapBearing(lastCompassBearing);
          }
        }

        $btnStart.style.display = 'none';
        $btnStop.style.display = 'inline-flex';
        $btnStart.classList.remove('idle');
        $statusText.textContent = 'LIVE';
        $statusText.style.color = 'var(--success)';
        updateMyStats();
        updateTeamList();
        broadcastMyPosition();
        updateMyTrailToFirebase();
        updateTeamActivity();
        showToast('🚴 Ride started!');
        if (myLastPosition && map) {
          map.setCenter([myLastPosition.lng, myLastPosition.lat]);
          followMode = true;
        }
      }

      function stopTracking() {
        isTracking = false;
        trackStartTime = null;
        $btnStart.style.display = 'inline-flex';
        $btnStart.classList.add('idle');
        $btnStop.style.display = 'none';
        $statusText.textContent = useManualLocation ? 'MANUAL' : 'CONNECTED';
        $statusText.style.color = useManualLocation ? 'var(--accent2)' : 'var(--success)';
        updateMyStats();
        updateTeamList();
        broadcastMyPosition();

        if (map) {
          map.setBearing(0);
        }

        if (myTrailRef) {
          myTrailRef.remove().catch(() => {});
        }
        clearRideSession();
        updateTeamActivity();
        showToast('⏹ Stopped. Distance: ' + myTotalDistance.toFixed(2) + ' km');
      }

      let currentToast = null;

      function showToast(msg, isError = false) {
        if (currentToast && currentToast.parentNode) {
          currentToast.remove();
          currentToast = null;
        }

        const toast = document.createElement('div');
        toast.className = 'toast' + (isError ? ' error' : '');
        toast.textContent = msg;
        $toastContainer.appendChild(toast);
        currentToast = toast;

        setTimeout(() => {
          if (toast.parentNode) {
            toast.remove();
            if (currentToast === toast) {
              currentToast = null;
            }
          }
        }, 3000);
      }

      function escapeHtml(s) {
        const d = document.createElement('div');
        d.textContent = s;
        return d.innerHTML;
      }

      // ===== SESSION =====
      const SESSION_KEY = 'biketeam_ridesession';

      function saveRideSession() {
        if (!isTracking) { localStorage.removeItem(SESSION_KEY); return; }
        try {
          const session = {
            isTracking: true,
            trackStartTime: trackStartTime,
            myTotalDistance: myTotalDistance,
            myRoutePoints: myRoutePoints.slice(-MAX_TRAIL_POINTS),
            lastPos: myLastPosition,
            timestamp: Date.now()
          };
          localStorage.setItem(SESSION_KEY, JSON.stringify(session));
        } catch (e) {}
      }

      function restoreRideSession() {
        try {
          const raw = localStorage.getItem(SESSION_KEY);
          if (!raw) return null;
          const session = JSON.parse(raw);
          if (Date.now() - session.timestamp > 3600000) {
            localStorage.removeItem(SESSION_KEY);
            return null;
          }
          return session;
        } catch (e) { return null; }
      }

      function clearRideSession() { localStorage.removeItem(SESSION_KEY); }

      // ===== TEST FIREBASE =====
      function testFirebaseConnection() {
        if (!teamCode) return;
        const testRef = database.ref('teams/' + teamCode + '/_test');
        testRef.set({ test: 'ping', time: Date.now(), device: myUserId })
          .then(() => { testRef.remove(); })
          .catch((error) => {
            showToast('❌ Firebase ERROR: ' + error.message, true);
          });
      }

      // ===== EVENT LISTENERS =====

      $toggleSidebar.addEventListener('click', () => {
        $sidebar.classList.toggle('hidden');
        if (window.innerWidth <= 768) {
          $sidebar.style.transform = $sidebar.classList.contains('hidden') ? 'translateX(-100%)' : 'translateX(0)';
        }
      });

      $closeSidebarBtn.addEventListener('click', () => {
        $sidebar.classList.add('hidden');
        if (window.innerWidth <= 768) {
          $sidebar.style.transform = 'translateX(-100%)';
        }
      });

      $followBtn.addEventListener('click', () => {
        followMode = true;
        if (myLastPosition && map) {
          map.setCenter([myLastPosition.lng, myLastPosition.lat]);
        }
        showToast('📍 Following you');
      });

      $locateBtn.addEventListener('click', () => {
        if (myLastPosition && map) {
          map.setCenter([myLastPosition.lng, myLastPosition.lat]);
          map.setZoom(16);
          followMode = true;
        } else {
          showToast('⏳ No position yet');
        }
      });

      $northBtn.addEventListener('click', () => {
        if (map) {
          map.setBearing(0);
          showToast('🧭 Map reset to North');
        }
      });

      $btnStart.addEventListener('click', startTracking);
      $btnStop.addEventListener('click', stopTracking);

      $statusSelect.addEventListener('change', function() {
        myStatus = this.value;
        localStorage.setItem('biketeam_mystatus', myStatus);
        broadcastMyPosition();
        updateTeamList();
        renderClusters();
        updateMyMarker();
        updateTeamActivity();
      });

      $myNameInput.addEventListener('change', function() {
        const newName = this.value.trim();
        if (newName && newName !== myName) {
          validateAndSetUsername(newName);
        } else if (!newName) {
          showToast('⚠️ Name cannot be empty.', true);
          this.value = myName;
        }
      });

      $myNameInput.addEventListener('keypress', (e) => {
        if (e.key === 'Enter') {
          e.preventDefault();
          const newName = $myNameInput.value.trim();
          if (newName && newName !== myName) {
            validateAndSetUsername(newName);
          } else if (!newName) {
            showToast('⚠️ Name cannot be empty.', true);
            $myNameInput.value = myName;
          }
        }
      });

      document.addEventListener('keydown', (e) => {
        if (e.key === 'f' && document.activeElement === document.body) { $followBtn.click(); }
        if (e.key === 's' && document.activeElement === document.body) { if (!isTracking) startTracking();
          else stopTracking(); }
      });

      window.addEventListener('resize', () => {
        if (window.innerWidth > 768) {
          $sidebar.style.transform = '';
        } else {
          $sidebar.style.transform = $sidebar.classList.contains('hidden') ? 'translateX(-100%)' : 'translateX(0)';
        }
      });

      setInterval(() => {
        if (myLastPosition) broadcastMyPosition();
      }, UPDATE_INTERVAL_MS);

      setInterval(() => {
        if (isTracking && myLastPosition) {
          updateMyTrailToFirebase();
        }
      }, TRAIL_UPDATE_INTERVAL_MS);

      setInterval(() => { saveRideSession(); }, 5000);

      window.addEventListener('beforeunload', function() { saveRideSession(); });

      // ===== INIT =====
      async function init() {
        let storedTeamCode = localStorage.getItem('biketeam_teamcode');

        if (storedTeamCode === 'openworld') {
          teamCode = storedTeamCode;
          isLeader = false;
          localStorage.removeItem('biketeam_isLeader');
          startAppWithTeam();
          return;
        }

        if (storedTeamCode) {
          const metaSnap = await database.ref('teams/' + storedTeamCode + '/_meta').once('value');
          if (metaSnap.exists()) {
            teamCode = storedTeamCode;
            const meta = metaSnap.val();
            if (meta.leaderId === myUserId) {
              isLeader = true;
              localStorage.setItem('biketeam_isLeader', 'true');
            } else {
              isLeader = false;
              localStorage.removeItem('biketeam_isLeader');
            }
            const mySnap = await database.ref('teams/' + teamCode + '/' + myUserId).once('value');
            if (!mySnap.exists()) {
              showToast('You are no longer in this team.', true);
              localStorage.removeItem('biketeam_teamcode');
              localStorage.removeItem('biketeam_isLeader');
              location.reload();
              return;
            }
            startAppWithTeam();
            return;
          } else {
            localStorage.removeItem('biketeam_teamcode');
            localStorage.removeItem('biketeam_isLeader');
          }
        }

        const choice = await showModal();
        if (choice === 'create') { await createTeam(); } else if (choice === 'join') { await joinTeam(); } else if (choice ===
          'openworld') { joinOpenWorld(); }
        if (!teamCode) {
          showToast('Selection failed. Please refresh.', true);
          location.reload();
        }
      }

      init();

    })();
  </script>
</body>
</html>
