<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <base href="/">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>🚴 BikeTeam Tracker – Live Cycling Monitor</title>

  <link rel="manifest" href="/manifest.json">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="BikeTeam">
  <link rel="apple-touch-icon" href="/apple-touch-icon.png">
  <meta name="msapplication-TileColor" content="#1a1a2e">
  <meta name="msapplication-TileImage" content="/icon-144.png">

  <!-- MapLibre -->
  <link href="https://unpkg.com/maplibre-gl@4.7.0/dist/maplibre-gl.css" rel="stylesheet" />
  <script src="https://unpkg.com/maplibre-gl@4.7.0/dist/maplibre-gl.js"></script>

  <!-- Firebase -->
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>

  <style>
    /* ===== ALL STYLES (unchanged) ===== */
    :root {
      --bg: #0a0a14;
      --panel: rgba(22, 33, 62, 0.85);
      --card: rgba(15, 52, 96, 0.7);
      --accent: #e94560;
      --accent2: #00d2ff;
      --text: #e8e8f0;
      --text-secondary: #9090a8;
      --border: rgba(42, 42, 74, 0.5);
      --success: #2ecc71;
      --warning: #f39c12;
      --danger: #e74c3c;
      --sidebar-w: 320px;
      --header-h: 48px;
      --radius: 16px;
      --shadow: 0 8px 40px rgba(0, 0, 0, 0.6);
      --touch-target: 44px;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
      background: var(--bg);
      color: var(--text);
      height: 100vh;
      width: 100vw;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
    }

    .header {
      height: var(--header-h);
      background: var(--panel);
      backdrop-filter: blur(12px);
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      padding: 0 12px;
      gap: 8px;
      z-index: 1000;
      flex-shrink: 0;
      box-shadow: 0 2px 20px rgba(0, 0, 0, 0.5);
    }
    .header .logo { font-size: 1.2rem; font-weight: 700; white-space: nowrap; letter-spacing: -0.5px; }
    .header .logo span { color: var(--accent2); }
    .status-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: var(--success);
      flex-shrink: 0;
      animation: pulse-dot 1.8s infinite;
    }
    @keyframes pulse-dot {
      0%, 100% { box-shadow: 0 0 0 0 rgba(46, 204, 113, 0.7); }
      50% { box-shadow: 0 0 0 8px rgba(46, 204, 113, 0); }
    }
    .status-text {
      font-size: 0.65rem;
      color: var(--success);
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      white-space: nowrap;
    }
    .spacer { flex: 1; }

    .btn {
      padding: 6px 14px;
      border-radius: 22px;
      border: none;
      cursor: pointer;
      font-weight: 600;
      font-size: 0.75rem;
      letter-spacing: 0.3px;
      transition: all 0.25s;
      white-space: nowrap;
      font-family: inherit;
      display: inline-flex;
      align-items: center;
      gap: 4px;
      min-height: var(--touch-target);
      background: transparent;
    }
    .btn:active { transform: scale(0.95); }
    .btn-outline { border: 1.5px solid var(--border); color: var(--text); background: transparent; }
    .btn-outline:active { border-color: var(--accent2); color: var(--accent2); }
    .btn-sm { padding: 4px 10px; font-size: 0.65rem; min-height: 30px; }

    .main-container { display: flex; flex: 1; overflow: hidden; position: relative; }

    .sidebar {
      width: var(--sidebar-w);
      background: var(--panel);
      backdrop-filter: blur(16px);
      border-right: 1px solid var(--border);
      display: flex;
      flex-direction: column;
      z-index: 500;
      flex-shrink: 0;
      transition: transform 0.35s cubic-bezier(0.4, 0, 0.2, 1);
      overflow: hidden;
      height: 100%;
    }
    .sidebar.hidden {
      transform: translateX(-100%);
      position: absolute;
      height: 100%;
      top: 0;
      left: 0;
      box-shadow: var(--shadow);
    }
    .sidebar-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 12px 16px;
      border-bottom: 1px solid var(--border);
      flex-shrink: 0;
      background: rgba(22, 33, 62, 0.6);
    }
    .sidebar-header h3 { margin: 0; font-size: 0.95rem; color: var(--accent2); }
    .sidebar-header button { background: none; border: none; color: var(--text); font-size: 1.6rem; cursor: pointer; padding: 0 4px; line-height: 1; }

    .sidebar-content {
      flex: 1;
      overflow-y: auto;
      padding-bottom: 12px;
      -webkit-overflow-scrolling: touch;
    }
    .sidebar-content::-webkit-scrollbar { width: 3px; }
    .sidebar-content::-webkit-scrollbar-track { background: transparent; }
    .sidebar-content::-webkit-scrollbar-thumb { background: var(--border); border-radius: 10px; }

    .sidebar-section { padding: 12px 16px; border-bottom: 1px solid var(--border); }
    .sidebar-section:last-child { border-bottom: none; }
    .sidebar-section h3 {
      font-size: 0.6rem;
      text-transform: uppercase;
      letter-spacing: 1.2px;
      color: var(--text-secondary);
      margin-bottom: 8px;
      font-weight: 700;
    }

    .my-stats { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; }
    .stat-card {
      background: var(--card);
      backdrop-filter: blur(4px);
      border-radius: var(--radius);
      padding: 8px 10px;
      text-align: center;
      border: 1px solid transparent;
      transition: border-color 0.3s;
    }
    .stat-card:active { border-color: var(--accent2); }
    .stat-value { font-size: 1.2rem; font-weight: 700; color: var(--accent2); line-height: 1.2; }
    .stat-label { font-size: 0.55rem; color: var(--text-secondary); text-transform: uppercase; margin-top: 2px; }

    .team-list { display: flex; flex-direction: column; gap: 4px; }
    .member-card {
      display: flex;
      align-items: center;
      gap: 10px;
      background: var(--card);
      backdrop-filter: blur(4px);
      border-radius: var(--radius);
      padding: 8px 12px;
      cursor: pointer;
      transition: all 0.25s;
      border: 1.5px solid transparent;
      min-height: 48px;
    }
    .member-card:active { background: rgba(26, 58, 110, 0.6); }
    .member-card.you { border-color: var(--accent2); box-shadow: 0 0 20px rgba(0, 210, 255, 0.15); }
    .member-card.offline { opacity: 0.5; }
    .member-dot {
      width: 32px;
      height: 32px;
      border-radius: 50%;
      flex-shrink: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.1rem;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.3);
    }
    .member-info { flex: 1; min-width: 0; }
    .member-name { font-weight: 700; font-size: 0.8rem; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .member-details { font-size: 0.6rem; color: var(--text-secondary); display: flex; gap: 8px; }
    .member-status {
      font-size: 0.5rem;
      padding: 2px 8px;
      border-radius: 10px;
      font-weight: 600;
      flex-shrink: 0;
    }
    .status-active { background: rgba(46, 204, 113, 0.2); color: var(--success); }
    .status-inactive { background: rgba(243, 156, 18, 0.2); color: var(--warning); }
    .badge-you { background: var(--accent2); color: #000; font-size: 0.5rem; padding: 1px 6px; border-radius: 6px; font-weight: 700; }
    .badge-leader { background: #ffd93d; color: #000; font-size: 0.5rem; padding: 1px 6px; border-radius: 6px; font-weight: 700; margin-left: 4px; }

    .admin-section { margin-top: 10px; border-top: 1px solid var(--border); padding-top: 10px; }
    .admin-section .admin-title { color: var(--warning); font-size: 0.6rem; text-transform: uppercase; letter-spacing: 1px; margin-bottom: 6px; }
    .admin-btn {
      background: transparent;
      border: 1px solid var(--danger);
      color: var(--danger);
      padding: 2px 8px;
      border-radius: 10px;
      font-size: 0.55rem;
      cursor: pointer;
    }
    .admin-btn:hover { background: var(--danger); color: #fff; }

    #statusSelect {
      background: var(--card);
      border: 1px solid var(--border);
      color: var(--text);
      padding: 6px 10px;
      border-radius: 20px;
      font-size: 0.7rem;
      outline: none;
      font-family: inherit;
      width: 100%;
    }
    #statusSelect option { background: var(--panel); }

    .route-controls { margin-top: 6px; border-top: 1px solid var(--border); padding-top: 6px; }
    .route-controls label { font-size: 0.6rem; color: var(--text-secondary); display: block; margin-bottom: 3px; }
    #gpxFileInput {
      width: 100%;
      padding: 3px;
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 12px;
      color: var(--text);
      font-size: 0.6rem;
    }
    #routeSelector {
      width: 100%;
      background: var(--card);
      border: 1px solid var(--border);
      color: var(--text);
      padding: 4px 8px;
      border-radius: 16px;
      font-size: 0.65rem;
      outline: none;
      font-family: inherit;
    }
    .delete-route-btn {
      background: transparent;
      border: 1px solid var(--danger);
      color: var(--danger);
      padding: 1px 6px;
      border-radius: 8px;
      font-size: 0.5rem;
      cursor: pointer;
    }
    .delete-route-btn:hover { background: var(--danger); color: #fff; }
    .route-list-item { display: flex; justify-content: space-between; align-items: center; padding: 3px 0; border-bottom: 1px solid var(--border); }
    .route-list-item span { font-size: 0.7rem; }

    .start-controls { margin-top: 6px; border-top: 1px solid var(--border); padding-top: 6px; }
    .start-controls label { font-size: 0.6rem; color: var(--text-secondary); display: block; margin-bottom: 3px; }

    #myNameInput {
      flex: 2;
      min-width: 100px;
      background: var(--card);
      border: 1px solid var(--border);
      color: var(--text);
      padding: 6px 10px;
      border-radius: 20px;
      font-size: 0.7rem;
      outline: none;
      font-family: inherit;
    }
    #myNameInput:focus { border-color: var(--accent2); }

    .map-container { flex: 1; position: relative; z-index: 100; }
    #map { width: 100%; height: 100%; background: #0a0a14; }

    .maplibregl-ctrl-group {
      background: var(--panel) !important;
      border: 1px solid var(--border) !important;
      backdrop-filter: blur(8px) !important;
    }
    .maplibregl-ctrl button { background: var(--panel) !important; color: var(--text) !important; }
    .maplibregl-ctrl button:hover { background: var(--card) !important; }
    .maplibregl-ctrl button svg { fill: var(--text) !important; }

    .map-btn {
      position: absolute;
      z-index: 600;
      width: var(--touch-target);
      height: var(--touch-target);
      border-radius: 50%;
      background: var(--panel);
      backdrop-filter: blur(12px);
      border: 1px solid var(--border);
      color: var(--text);
      font-size: 1.1rem;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      box-shadow: var(--shadow);
      transition: all 0.25s;
    }
    .map-btn:active { border-color: var(--accent2); color: var(--accent2); transform: scale(0.92); }
    .toggle-sidebar { top: 12px; left: 12px; }
    .follow-btn { bottom: 130px; right: 14px; }
    .locate-btn { bottom: 72px; right: 14px; }
    .north-btn { bottom: 188px; right: 14px; }

    #stats-overlay {
      position: absolute;
      top: 12px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 500;
      background: rgba(10, 10, 20, 0.85);
      backdrop-filter: blur(16px);
      border: 1.5px solid rgba(0, 210, 255, 0.25);
      border-radius: var(--radius);
      padding: 10px 22px;
      display: flex;
      gap: 24px;
      align-items: center;
      box-shadow: 0 4px 30px rgba(0, 210, 255, 0.15), 0 0 60px rgba(0, 210, 255, 0.05);
      min-width: 220px;
      justify-content: center;
      pointer-events: none;
      transition: opacity 0.3s;
    }
    #stats-overlay .stat-item { text-align: center; pointer-events: none; }
    #stats-overlay .stat-value {
      font-size: 1.4rem;
      font-weight: 800;
      color: var(--accent2);
      line-height: 1.2;
      text-shadow: 0 0 20px rgba(0, 210, 255, 0.3);
      letter-spacing: 0.5px;
    }
    #stats-overlay .stat-label {
      font-size: 0.5rem;
      color: var(--text-secondary);
      text-transform: uppercase;
      letter-spacing: 0.8px;
      margin-top: 1px;
      font-weight: 600;
    }
    #stats-overlay .divider { width: 1px; height: 32px; background: var(--border); }

    #controls-overlay {
      position: absolute;
      bottom: 20%;
      left: 50%;
      transform: translateX(-50%);
      z-index: 500;
      display: flex;
      gap: 16px;
      align-items: center;
      pointer-events: none;
    }
    #controls-overlay .btn {
      pointer-events: auto;
      font-size: 1.2rem;
      padding: 14px 40px;
      border-radius: 40px;
      min-height: 60px;
      min-width: 140px;
      justify-content: center;
      box-shadow: 0 8px 40px rgba(0, 0, 0, 0.5);
      font-weight: 800;
      letter-spacing: 1px;
      border: none;
      transition: all 0.3s ease;
      position: relative;
    }
    #controls-overlay .btn:active { transform: scale(0.93); }

    #controls-overlay .btn-start {
      background: linear-gradient(135deg, #2ecc71, #27ae60);
      color: #fff;
      box-shadow: 0 0 30px rgba(46, 204, 113, 0.4), 0 8px 40px rgba(0, 0, 0, 0.5);
    }
    #controls-overlay .btn-start:hover {
      box-shadow: 0 0 50px rgba(46, 204, 113, 0.6), 0 8px 40px rgba(0, 0, 0, 0.5);
      transform: scale(1.02);
    }
    #controls-overlay .btn-stop {
      background: linear-gradient(135deg, #e74c3c, #c0392b);
      color: #fff;
      box-shadow: 0 0 30px rgba(231, 76, 60, 0.4), 0 8px 40px rgba(0, 0, 0, 0.5);
    }
    #controls-overlay .btn-stop:hover {
      box-shadow: 0 0 50px rgba(231, 76, 60, 0.6), 0 8px 40px rgba(0, 0, 0, 0.5);
      transform: scale(1.02);
    }

    @keyframes pulse-ring {
      0% { box-shadow: 0 0 0 0 rgba(46, 204, 113, 0.4); }
      70% { box-shadow: 0 0 0 20px rgba(46, 204, 113, 0); }
      100% { box-shadow: 0 0 0 0 rgba(46, 204, 113, 0); }
    }
    #controls-overlay .btn-start.idle { animation: pulse-ring 2s ease-in-out infinite; }

    .toast {
      position: fixed;
      top: 60px;
      right: 16px;
      z-index: 9999;
      background: var(--card);
      backdrop-filter: blur(12px);
      border: 1px solid var(--accent2);
      border-radius: var(--radius);
      padding: 10px 16px;
      color: var(--text);
      font-weight: 600;
      font-size: 0.75rem;
      animation: slideIn 0.35s ease, slideOut 0.35s ease 2.8s forwards;
      box-shadow: var(--shadow);
      max-width: 280px;
    }
    .toast.error { border-color: var(--danger); background: rgba(74, 26, 26, 0.9); }
    @keyframes slideIn { from { transform: translateX(120%); opacity: 0; } to { transform: translateX(0); opacity: 1; } }
    @keyframes slideOut { from { transform: translateX(0); opacity: 1; } to { transform: translateX(120%); opacity: 0; } }

    .modal-overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0, 0, 0, 0.75);
      backdrop-filter: blur(8px);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 9999;
    }
    .modal-box {
      background: var(--panel);
      backdrop-filter: blur(16px);
      border-radius: var(--radius);
      padding: 28px 24px;
      max-width: 400px;
      width: 90%;
      border: 1px solid var(--border);
      box-shadow: var(--shadow);
    }
    .modal-box h2 { color: var(--accent2); margin-bottom: 12px; text-align: center; font-size: 1.4rem; }
    .modal-box p { text-align: center; color: var(--text-secondary); margin-bottom: 16px; font-size: 0.85rem; }
    .modal-box .btn-group { display: flex; flex-direction: column; gap: 8px; }
    .modal-box .btn-group .btn { width: 100%; justify-content: center; padding: 10px; font-size: 0.9rem; border-radius: 24px; }
    .modal-box .btn-group .btn-start { background: var(--accent2); color: #000; }
    .modal-box .btn-group .btn-start:hover { background: #33ddff; }

    @media (max-width: 768px) {
      :root { --header-h: 44px; --sidebar-w: 280px; }
      .header .logo { font-size: 1rem; }
      .btn { padding: 4px 10px; font-size: 0.65rem; min-height: 34px; }
      .sidebar { position: absolute; top: 0; left: 0; height: 100%; width: var(--sidebar-w); }
      .sidebar:not(.hidden) { transform: translateX(0); }
      .sidebar.hidden { transform: translateX(-100%); }
      .toggle-sidebar { top: 8px; left: 8px; width: 38px; height: 38px; font-size: 1rem; }
      .map-btn { width: 38px; height: 38px; font-size: 1rem; }
      .follow-btn { bottom: 115px; right: 10px; }
      .locate-btn { bottom: 60px; right: 10px; }
      .north-btn { bottom: 170px; right: 10px; }
      #stats-overlay { top: 8px; padding: 8px 16px; gap: 14px; min-width: 160px; border-radius: 12px; }
      #stats-overlay .stat-value { font-size: 1.1rem; }
      #stats-overlay .stat-label { font-size: 0.45rem; }
      #controls-overlay { bottom: 20%; }
      #controls-overlay .btn { font-size: 1rem; padding: 12px 28px; min-height: 50px; min-width: 110px; }
      .modal-box { padding: 20px 16px; }
      .modal-box h2 { font-size: 1.2rem; }
      .sidebar-header h3 { font-size: 0.8rem; }
      .stat-value { font-size: 1rem; }
      .member-name { font-size: 0.75rem; }
    }

    @media (max-width: 480px) {
      :root { --header-h: 40px; --sidebar-w: 260px; }
      #stats-overlay { gap: 10px; padding: 6px 12px; min-width: 130px; top: 6px; }
      #stats-overlay .stat-value { font-size: 0.9rem; }
      #stats-overlay .divider { height: 18px; }
      #controls-overlay { bottom: 20%; }
      #controls-overlay .btn { font-size: 0.85rem; padding: 10px 20px; min-height: 44px; min-width: 90px; }
      .member-card { padding: 6px 10px; min-height: 40px; }
      .member-dot { width: 28px; height: 28px; font-size: 0.9rem; }
      .member-name { font-size: 0.7rem; }
    }

    .custom-marker {
      display: flex;
      align-items: center;
      justify-content: center;
      width: 42px;
      height: 42px;
      border-radius: 50%;
      font-size: 1.6rem;
      filter: drop-shadow(0 4px 12px rgba(0, 0, 0, 0.6));
      transition: transform 0.15s;
      cursor: pointer;
      background: var(--panel);
      border: 2px solid transparent;
    }
    .custom-marker.you-marker {
      animation: bounce-marker 0.6s ease infinite alternate;
      font-size: 2rem;
      width: 50px;
      height: 50px;
      border-color: var(--accent2);
      box-shadow: 0 0 30px rgba(0, 210, 255, 0.3);
    }
    .custom-marker.cluster-marker {
      width: 60px;
      height: 60px;
      font-size: 1.8rem;
      background: rgba(22, 33, 62, 0.9);
      border-color: #ffd93d;
      box-shadow: 0 0 30px rgba(255, 217, 61, 0.4);
      animation: pulse-cluster 1.5s ease-in-out infinite;
    }
    @keyframes pulse-cluster {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(1.08); }
    }
    .start-flag-marker {
      width: 36px;
      height: 36px;
      font-size: 1.8rem;
      background: transparent !important;
      border: none !important;
      filter: drop-shadow(0 0 8px rgba(255, 215, 0, 0.8));
      animation: pulse-flag 1s ease-in-out infinite alternate;
    }
    @keyframes pulse-flag {
      0% { transform: scale(1); }
      100% { transform: scale(1.15); }
    }
  </style>
</head>
<body>
  <header class="header">
    <span style="font-size:1.2rem;">🚴</span>
    <span class="logo">Bike<span>Team</span></span>
    <div class="status-dot" id="statusDot"></div>
    <span class="status-text" id="statusText">CONNECTING</span>
    <span class="spacer"></span>
  </header>

  <div class="main-container">
    <aside class="sidebar hidden" id="sidebar">
      <div class="sidebar-header">
        <h3 id="sidebarTitle">👥 Team</h3>
        <button id="closeSidebarBtn">✕</button>
      </div>
      <div class="sidebar-content">
        <div class="sidebar-section">
          <h3>📊 My Ride</h3>
          <div class="my-stats">
            <div class="stat-card"><div class="stat-value" id="mySpeed">0.0</div><div class="stat-label">km/h</div></div>
            <div class="stat-card"><div class="stat-value" id="myDistance">0.00</div><div class="stat-label">km</div></div>
            <div class="stat-card"><div class="stat-value" id="myElapsed">00:00</div><div class="stat-label">time</div></div>
            <div class="stat-card"><div class="stat-value" id="myAltitude">--</div><div class="stat-label">m</div></div>
          </div>
          <div style="margin-top:8px; display:flex; gap:6px; align-items:center; flex-wrap:wrap;">
            <input type="text" id="myNameInput" placeholder="Your name" maxlength="20">
            <select id="statusSelect" style="flex:1; min-width:80px;">
              <option value="🟢 All Good">🟢 All Good</option>

  <div id="toastContainer"></div>

  <script>
    (function() {
      // ===== FIREBASE CONFIG =====
      const firebaseConfig = {
        apiKey: "AIzaSyDQI0kkCJPNq-RYtzKhCEYS5sjQRcc5X0E",
        databaseURL: "https://biketeamtracker-default-rtdb.asia-southeast1.firebasedatabase.app",
        authDomain: "biketeamtracker.firebaseapp.com",
        projectId: "biketeamtracker",
        storageBucket: "biketeamtracker.firebasestorage.app",
        messagingSenderId: "265626967108",
        appId: "1:265626967108:web:e142245b2cfe36097df011"
      };

      firebase.initializeApp(firebaseConfig);
      const database = firebase.database();

      // ===== USER ID =====
      let myUserId = localStorage.getItem('biketeam_userid');
      if (!myUserId) {
        myUserId = 'user_' + Math.random().toString(36).substring(2, 10);
        localStorage.setItem('biketeam_userid', myUserId);
      }

      // ===== TEAM CLEANUP =====
      const TEAM_CLEANUP_TIMEOUT_MS = 5 * 60 * 1000; // 5 minutes

      // ===== STATE =====
      const UPDATE_INTERVAL_MS = 1500;
      const TRAIL_UPDATE_INTERVAL_MS = 10000;
      const STALE_THRESHOLD_MS = 20000;
      const MAX_TRAIL_POINTS = 300;
      const CLUSTER_DISTANCE_KM = 0.05;
      const USER_COLORS = ['#00d2ff', '#ff6b6b', '#ffd93d', '#6bcb77', '#ff922b', '#845ef7', '#f06595', '#20c997', '#ff6b9d',
        '#4ecdc4', '#ffe66d', '#a29bfe'
      ];

      let myName = localStorage.getItem('biketeam_myname') || 'Me';
      let myStatus = localStorage.getItem('biketeam_mystatus') || '🟢 All Good';
      const myColor = USER_COLORS[Math.floor(Math.random() * USER_COLORS.length)];

      let isTracking = false;
      let trackStartTime = null;
      let myLastPosition = null;
      let myTotalDistance = 0;
      let myRoutePoints = [];
      let myCurrentSpeed = 0;
      let myCurrentAltitude = null;
      let geoWatchId = null;
      let useManualLocation = false;
      let teamCode = null;
      let isLeader = false;

      const remoteUsers = {};
      const remoteTrailPoints = {};

      let map = null;
      let mapInitialized = false;
      let followMode = true;

      let clusterMarkers = [];

      const MY_TRAIL_SOURCE = 'my-trail-source';
      const MY_TRAIL_LAYER = 'my-trail-layer';

      let remoteTrails = {};

      // ---- ROUTE & START POINT STATE ----
      let routeSourceId = null;
      let routeLayerId = null;
      let activeRouteId = null;
      let startMarker = null;        // For manually set start point (leader)
      let routeStartMarker = null;   // For flag at first point of active route

      // ---- MY OWN MARKER ----
      let myMarker = null;

      // ---- TEAM CLEANUP ----
      let teamCleanupInterval = null;

      // ---- 🔥 FIX: Prevent duplicate team creation ----
      let isCreatingTeam = false;

      // ---- Track previous leaderId to avoid unnecessary admin panel rebuilds ----
      let previousLeaderId = null;

      // DOM refs
      const $sidebar = document.getElementById('sidebar');
      const $sidebarTitle = document.getElementById('sidebarTitle');
      const $toggleSidebar = document.getElementById('toggleSidebar');
      const $closeSidebarBtn = document.getElementById('closeSidebarBtn');
      const $teamList = document.getElementById('teamList');
      const $teamCount = document.getElementById('teamCount');
      const $adminPanel = document.getElementById('adminPanel');
      const $toastContainer = document.getElementById('toastContainer');
      const $statusDot = document.getElementById('statusDot');
      const $statusText = document.getElementById('statusText');
      const $btnStart = document.getElementById('btnStart');
      const $btnStop = document.getElementById('btnStop');
      const $myNameInput = document.getElementById('myNameInput');
      const $statusSelect = document.getElementById('statusSelect');
      const $followBtn = document.getElementById('followBtn');
      const $locateBtn = document.getElementById('locateBtn');
      const $northBtn = document.getElementById('northBtn');

      const $mySpeed = document.getElementById('mySpeed');
      const $myDistance = document.getElementById('myDistance');
      const $myElapsed = document.getElementById('myElapsed');
      const $myAltitude = document.getElementById('myAltitude');
      const $miniSpeed = document.getElementById('miniSpeed');
      const $miniDist = document.getElementById('miniDist');
      const $miniTime = document.getElementById('miniTime');

      // ===== MODAL =====
      function showModal() {
        return new Promise((resolve) => {
          const overlay = document.createElement('div');
          overlay.className = 'modal-overlay';
          overlay.id = 'teamModal';
          overlay.innerHTML = `
            <div class="modal-box">
              <h2>🚴 BikeTeam</h2>
              <p>Choose how you want to ride.</p>
              <div class="btn-group">
                <button id="modalOpenWorldBtn" class="btn btn-start" style="background:var(--accent2);">🌍 Open World</button>
                <button id="modalCreateBtn" class="btn btn-outline">✨ Create Private Team</button>
                <button id="modalJoinBtn" class="btn btn-outline">🔑 Join Private Team</button>
              </div>
            </div>
          `;
          document.body.appendChild(overlay);

          overlay.querySelector('#modalOpenWorldBtn').onclick = () => {
            overlay.remove();
            resolve('openworld');
          };
          overlay.querySelector('#modalCreateBtn').onclick = () => {
            overlay.remove();
            resolve('create');
          };
          overlay.querySelector('#modalJoinBtn').onclick = () => {
            overlay.remove();
            resolve('join');
          };
        });
      }

      // ============================================================
      // 🔥 FIXED: TEAM CREATION WITH DUPLICATE GUARD
      // ============================================================
      async function createTeam() {
        if (isCreatingTeam) {
          showToast('⏳ Already creating a team, please wait...', true);
          return false;
        }
        isCreatingTeam = true;

        try {
          const teamName = prompt('👑 Enter a name for your new team (e.g., "Sunday Riders"):', 'My Team');
          if (!teamName) return false;
          const trimmed = teamName.trim();
          if (!trimmed) { showToast('Team name cannot be empty.', true); return false; }

          try {
            const nameSnap = await database.ref('teams')
              .orderByChild('_meta/teamName')
              .equalTo(trimmed)
              .once('value');

            if (nameSnap.exists()) {
              showToast(`❌ Team name "${trimmed}" is already taken. Please choose another.`, true);
              return false;
            }
          } catch (e) {
            showToast('⚠️ Could not validate team name. Please try again.', true);
            return false;
          }

          let code = '';
          let attempts = 0;
          while (attempts < 50) {
            const candidate = String(Math.floor(1000 + Math.random() * 9000));
            const snap = await database.ref('teamCodes/' + candidate).once('value');
            if (!snap.exists()) {
              code = candidate;
              break;
            }
            attempts++;
          }
          if (!code) { showToast('Could not generate a unique code. Please try again.', true); return false; }

          const teamCodeRaw = 'team_' + Date.now().toString(36) + '_' + Math.random().toString(36).substring(2, 6);
          const teamCodeClean = teamCodeRaw.toLowerCase().replace(/[^a-z0-9_]/g, '');
          const leaderId = myUserId;
          const leaderName = myName;

          const updates = {};
          updates['teams/' + teamCodeClean + '/_meta'] = {
            leaderId: leaderId,
            leaderName: leaderName,
            teamName: trimmed,
            createdAt: Date.now(),
            lastActivity: Date.now()
          };
          updates['teamCodes/' + code] = {
            teamCode: teamCodeClean,
            leaderId: leaderId,
            leaderName: leaderName,
            teamName: trimmed,
            createdAt: Date.now()
          };

          await database.ref().update(updates);
          teamCode = teamCodeClean;
          isLeader = true;
          localStorage.setItem('biketeam_teamcode', teamCode);
          localStorage.setItem('biketeam_isLeader', 'true');
          showToast(`✅ Team "${trimmed}" created! Share code: ${code}`);
          startAppWithTeam();
          return true;
        } catch (e) {
          showToast('❌ Error creating team: ' + e.message, true);
          return false;
        } finally {
          isCreatingTeam = false;
        }
      }

      async function joinTeam() {
        const codeInput = prompt('🔑 Enter the 4‑digit team code provided by the leader:', '');
        if (codeInput === null) return false;
        const code = codeInput.trim();
        if (!/^\d{4}$/.test(code)) {
          showToast('Please enter a valid 4‑digit numeric code.', true);
          return false;
        }

        const snap = await database.ref('teamCodes/' + code).once('value');
        const data = snap.val();
        if (!data) {
          showToast('❌ No team found with that code. Please check with your leader.', true);
          return false;
        }

        teamCode = data.teamCode;
        isLeader = false;
        localStorage.setItem('biketeam_teamcode', teamCode);
        localStorage.removeItem('biketeam_isLeader');

        database.ref('teams/' + teamCode + '/_meta/lastActivity').set(Date.now());

        showToast(`✅ Joined team "${data.teamName || 'Unnamed'}"!`);
        startAppWithTeam();
        return true;
      }

      function joinOpenWorld() {
        teamCode = 'openworld';
        isLeader = false;
        localStorage.setItem('biketeam_teamcode', teamCode);
        localStorage.removeItem('biketeam_isLeader');
        showToast('🌍 Welcome to Open World!');
        startAppWithTeam();
      }

      // ===== TEAM CLEANUP =====
      function startTeamCleanup() {
        if (teamCleanupInterval) clearInterval(teamCleanupInterval);
        teamCleanupInterval = setInterval(() => {
          if (!teamCode || teamCode === 'openworld') return;

          database.ref('teams/' + teamCode + '/_meta').once('value').then((snap) => {
            if (!snap.exists()) {
              clearInterval(teamCleanupInterval);
              return;
            }
            const meta = snap.val();
            const lastActivity = meta.lastActivity || 0;
            const now = Date.now();

            if (now - lastActivity > TEAM_CLEANUP_TIMEOUT_MS) {
              console.log(`🧹 Team "${teamCode}" inactive. Deleting...`);
              database.ref('teamCodes').orderByChild('teamCode').equalTo(teamCode).once('value').then((codeSnap) => {
                const updates = {};
                codeSnap.forEach((child) => {
                  updates['teamCodes/' + child.key] = null;
                });
                updates['teams/' + teamCode] = null;
                return database.ref().update(updates);
              }).then(() => {
                showToast('🧹 Team deleted due to inactivity.', true);
                localStorage.removeItem('biketeam_teamcode');
                localStorage.removeItem('biketeam_isLeader');
                if (teamCleanupInterval) clearInterval(teamCleanupInterval);
                setTimeout(() => { location.reload(); }, 1500);
              }).catch((err) => {
                console.warn('⚠️ Failed to delete inactive team:', err);
              });
            }
          }).catch((err) => {
            console.warn('⚠️ Could not check team activity:', err);
          });
        }, 30000);
      }

      function updateTeamActivity() {
        if (!teamCode || teamCode === 'openworld') return;
        database.ref('teams/' + teamCode + '/_meta/lastActivity').set(Date.now())
          .catch(() => {});
      }

      // ===== START APP =====
      let appStarted = false;

      function startAppWithTeam() {
        if (appStarted) return;
        appStarted = true;

        if (teamCode === 'openworld') {
          $sidebarTitle.textContent = '🌍 Open World';
        } else {
          $sidebarTitle.textContent = '👥 Team Panel';
          startTeamCleanup();
        }

        initMap();
        initOrientation();
        $myNameInput.value = myName;
        $statusSelect.value = myStatus;

        const session = restoreRideSession();
        if (session && session.isTracking && session.lastPos) {
          isTracking = true;
          trackStartTime = session.trackStartTime;
          myTotalDistance = session.myTotalDistance || 0;
          myRoutePoints = session.myRoutePoints || [];
          myLastPosition = session.lastPos;
          updateMyStats();
          renderClusters();
          updateMyTrail();
          $btnStart.style.display = 'none';
          $btnStop.style.display = 'inline-flex';
          $statusText.textContent = 'LIVE';
          $statusText.style.color = 'var(--success)';
          showToast('🔄 Ride restored from idle state.');
        } else {
          $btnStart.classList.add('idle');
        }

        if (window.innerWidth <= 768) {
          $sidebar.classList.add('hidden');
          $sidebar.style.transform = 'translateX(-100%)';
        } else {
          $sidebar.classList.remove('hidden');
        }

        const geoStarted = startGeolocation();
        if (!geoStarted && !useManualLocation) {
          if (!myLastPosition && map) {
            map.setCenter([0, 0]);
            $statusText.textContent = 'NO GPS';
            $statusDot.style.background = 'var(--warning)';
            $statusDot.style.animation = 'none';
          }
        }

        setupFirebaseListeners();
        updateTeamList();
        updateAdminPanel(); // build once at startup

        setInterval(updateMyStats, 1000);
        showToast(`🔑 Team: ${teamCode}`);

        setTimeout(() => {
          validateAndSetUsername(myName);
        }, 1000);

        setTimeout(testFirebaseConnection, 3000);

        if ('serviceWorker' in navigator) {
          window.addEventListener('load', () => {
            navigator.serviceWorker.register('/sw.js')
              .catch(() => {});
          });
        }
      }

      // ===== FIREBASE LISTENERS =====
      let locationsRef = null;
      let myLocationRef = null;
      let trailsRef = null;
      let myTrailRef = null;

      function setupFirebaseListeners() {
        if (!teamCode) return;
        myLocationRef = database.ref('teams/' + teamCode + '/' + myUserId);
        locationsRef = database.ref('teams/' + teamCode);

        locationsRef.on('child_added', (snapshot) => {
          if (snapshot.key === myUserId) return;
          if (snapshot.key === '_meta') {
            const meta = snapshot.val();
            previousLeaderId = meta.leaderId;
            if (meta && meta.leaderId === myUserId) {
              isLeader = true;
              localStorage.setItem('biketeam_isLeader', 'true');
            } else {
              isLeader = false;
              localStorage.removeItem('biketeam_isLeader');
            }
            updateAdminPanel();
            return;
          }
          remoteUsers[snapshot.key] = snapshot.val();
          renderClusters();
          updateTeamList();
          showToast(`👋 ${remoteUsers[snapshot.key]?.userName || 'Rider'} joined!`);
          updateTeamActivity();
        });

        locationsRef.on('child_changed', (snapshot) => {
          if (snapshot.key === myUserId) return;
          if (snapshot.key === '_meta') {
            const meta = snapshot.val();
            // Only rebuild admin panel if the leaderId changed
            if (meta.leaderId !== previousLeaderId) {
              previousLeaderId = meta.leaderId;
              if (meta && meta.leaderId === myUserId) {
                isLeader = true;
                localStorage.setItem('biketeam_isLeader', 'true');
              } else {
                isLeader = false;
                localStorage.removeItem('biketeam_isLeader');
              }
              updateAdminPanel();
            }
            // If only lastActivity changed, we ignore it
            return;
          }
          if (remoteUsers[snapshot.key]) {
            remoteUsers[snapshot.key] = { ...remoteUsers[snapshot.key], ...snapshot.val() };
          } else {
            remoteUsers[snapshot.key] = snapshot.val();
          }
          renderClusters();
          updateTeamList();
          updateTeamActivity();
        });

        locationsRef.on('child_removed', (snapshot) => {
          const uid = snapshot.key;
          if (uid === '_meta') return;
          if (uid === myUserId) {
            showToast('❌ You have been removed from the team by the leader.', true);
            localStorage.removeItem('biketeam_teamcode');
            localStorage.removeItem('biketeam_isLeader');
            if (teamCleanupInterval) clearInterval(teamCleanupInterval);
            setTimeout(() => location.reload(), 500);
            return;
          }
          if (remoteUsers[uid]) {
            delete remoteUsers[uid];
            delete remoteTrailPoints[uid];
            removeRemoteTrail(uid);
          }
          renderClusters();
          updateTeamList();
        });

        // Trail listener
        myTrailRef = database.ref('teams/' + teamCode + '/trails/' + myUserId);
        trailsRef = database.ref('teams/' + teamCode + '/trails');
        trailsRef.on('child_added', (snapshot) => {
          const uid = snapshot.key;
          if (uid === myUserId) return;
          const data = snapshot.val();
          if (data && data.points && data.points.length > 1) {
            remoteTrailPoints[uid] = data.points;
            updateRemoteTrail(uid, data.points);
          }
        });

        trailsRef.on('child_changed', (snapshot) => {
          const uid = snapshot.key;
          if (uid === myUserId) return;
          const data = snapshot.val();
          if (data && data.points && data.points.length > 1) {
            remoteTrailPoints[uid] = data.points;
            updateRemoteTrail(uid, data.points);
          } else if (data && data.points && data.points.length === 0) {
            remoteTrailPoints[uid] = [];
            removeRemoteTrail(uid);
          }
        });

        // ---- ROUTES ----
        if (teamCode !== 'openworld') {
          const savedRoutesRef = database.ref('teams/' + teamCode + '/savedRoutes');
          savedRoutesRef.on('value', () => {
            renderRouteDropdown();
            renderRouteList();
          });

          const activeRouteRef = database.ref('teams/' + teamCode + '/activeRouteId');
          activeRouteRef.on('value', (snapshot) => {
            const newActiveId = snapshot.val();

            // Remove old route line and flag marker
            if (routeLayerId && map) {
              try {
                if (map.getLayer(routeLayerId)) map.removeLayer(routeLayerId);
                if (map.getSource(routeSourceId)) map.removeSource(routeSourceId);
              } catch (e) {}
              routeLayerId = null;
              routeSourceId = null;
            }

            // Remove route start flag marker
            if (routeStartMarker) {
              routeStartMarker.remove();
              routeStartMarker = null;
            }

            activeRouteId = newActiveId;
            renderRouteDropdown();

            if (!newActiveId) {
              showToast('🗺️ Route cleared.');
              return;
            }

            database.ref('teams/' + teamCode + '/savedRoutes/' + newActiveId).once('value').then((snap) => {
              const route = snap.val();
              if (route && route.points && route.points.length > 1 && map && mapInitialized) {
                const coords = route.points.map(p => [p[1], p[0]]);
                const geojson = {
                  type: 'Feature',
                  geometry: {
                    type: 'LineString',
                    coordinates: coords
                  }
                };
                const sourceId = 'route-source-' + newActiveId;
                const layerId = 'route-layer-' + newActiveId;
                routeSourceId = sourceId;
                routeLayerId = layerId;

                try {
                  map.addSource(sourceId, { type: 'geojson', data: geojson });
                  map.addLayer({
                    id: layerId,
                    type: 'line',
                    source: sourceId,
                    paint: {
                      'line-color': '#ffd93d',
                      'line-width': 5,
                      'line-dasharray': [10, 6],
                      'line-opacity': 0.8
                    }
                  });

                  // ✅ Add flag marker at first point of the route
                  const firstPoint = route.points[0];
                  if (firstPoint && firstPoint.length === 2) {
                    const el = document.createElement('div');
                    el.className = 'start-flag-marker';
                    el.textContent = '🚩';
                    routeStartMarker = new maplibregl.Marker({ element: el, anchor: 'center' })
                      .setLngLat([firstPoint[1], firstPoint[0]])
                      .addTo(map);
                    const popup = new maplibregl.Popup({ offset: [0, -10] })
                      .setHTML('<b>🏁 Route Start</b>');
                    routeStartMarker.setPopup(popup);
                  }

                  showToast(`🗺️ Route "${route.name || 'Route'}" loaded with start flag.`);
                } catch (e) {
                  showToast('⚠️ Error drawing route: ' + e.message, true);
                }
              }
            });
          });

          const startRef = database.ref('teams/' + teamCode + '/startPoint');
          startRef.on('value', (snapshot) => {
            const startData = snapshot.val();
            // Remove existing start marker (manual) if any
            if (startMarker) {
              startMarker.remove();
              startMarker = null;
            }
            if (startData && startData.lat && startData.lng && map && mapInitialized) {
              const el = document.createElement('div');
              el.className = 'start-flag-marker';
              el.textContent = '🚩';
              startMarker = new maplibregl.Marker({ element: el, anchor: 'center' })
                .setLngLat([startData.lng, startData.lat])
                .addTo(map);
              const popup = new maplibregl.Popup({ offset: [0, -10] })
                .setHTML('<b>🏁 Start Point (manual)</b>');
              startMarker.setPopup(popup);
              showToast('📍 Start point set manually!');
            }
          });
        }

        setInterval(() => {
          const now = Date.now();
          let updated = false;
          for (const uid in remoteUsers) {
            const u = remoteUsers[uid];
            const stale = (now - (u.timestamp || 0)) > STALE_THRESHOLD_MS;
            if (stale && !u._offline) {
              u._offline = true;
              updated = true;
            } else if (!stale && u._offline) {
              u._offline = false;
              updated = true;
            }
          }
          if (updated) {
            renderClusters();
            updateTeamList();
          }
        }, 5000);
      }

      function broadcastMyPosition() {
        if (!myLastPosition || !myLocationRef) return;
        const data = {
          userId: myUserId,
          userName: myName,
          lat: myLastPosition.lat,
          lng: myLastPosition.lng,
          speed: myCurrentSpeed,
          altitude: myCurrentAltitude,
          color: myColor,
          timestamp: Date.now(),
          isTracking: isTracking,
          status: myStatus
        };
        myLocationRef.set(data).catch((error) => {
          showToast('❌ Firebase Error: ' + error.message, true);
        });
        updateTeamActivity();
      }

      function updateMyTrailToFirebase() {
        if (!isTracking || myRoutePoints.length < 2 || !myTrailRef) return;
        myTrailRef.set({
          points: myRoutePoints.slice(-MAX_TRAIL_POINTS),
          updatedAt: Date.now()
        }).catch(() => {});
      }

      function updateRemoteTrail(uid, points) {
        if (!map || !mapInitialized) return;
        if (remoteTrails[uid]) {
          try {
            const oldId = remoteTrails[uid];
            if (map.getLayer(oldId)) map.removeLayer(oldId);
            if (map.getSource(oldId)) map.removeSource(oldId);
          } catch (e) {}
          remoteTrails[uid] = null;
        }
        if (!points || points.length < 2) return;

        const geojson = {
          type: 'Feature',
          geometry: {
            type: 'LineString',
            coordinates: points.map(p => [p[1], p[0]])
          }
        };
        const sourceId = 'remote-trail-' + uid;
        remoteTrails[uid] = sourceId;
        try {
          map.addSource(sourceId, { type: 'geojson', data: geojson });
          const user = remoteUsers[uid] || {};
          map.addLayer({
            id: 'remote-trail-layer-' + uid,
            type: 'line',
            source: sourceId,
            paint: {
              'line-color': user.color || '#888',
              'line-width': 3,
              'line-opacity': 0.5,
              'line-dasharray': [6, 4]
            }
          });
        } catch (e) {}
      }

      function removeRemoteTrail(uid) {
        if (remoteTrails[uid]) {
          try {
            const id = remoteTrails[uid];
            if (map.getLayer(id)) map.removeLayer(id);
            if (map.getSource(id)) map.removeSource(id);
          } catch (e) {}
          delete remoteTrails[uid];
        }
      }

      // ===== CLUSTERING =====
      function getClusters(riders) {
        const clusters = [];
        const used = new Set();
        for (let i = 0; i < riders.length; i++) {
          if (used.has(i)) continue;
          const cluster = {
            riders: [riders[i]],
            lat: riders[i].lat,
            lng: riders[i].lng
          };
          used.add(i);
          for (let j = i + 1; j < riders.length; j++) {
            if (used.has(j)) continue;
            const dist = haversineDistance(riders[i].lat, riders[i].lng, riders[j].lat, riders[j].lng);
            if (dist < CLUSTER_DISTANCE_KM) {
              cluster.riders.push(riders[j]);
              used.add(j);
              let sumLat = 0,
                sumLng = 0;
              for (const r of cluster.riders) {
                sumLat += r.lat;
                sumLng += r.lng;
              }
              cluster.lat = sumLat / cluster.riders.length;
              cluster.lng = sumLng / cluster.riders.length;
            }
          }
          clusters.push(cluster);
        }
        return clusters;
      }

      function renderClusters() {
        if (!map || !mapInitialized) return;

        const riders = [];

        for (const uid in remoteUsers) {
          const u = remoteUsers[uid];
          if (!u.lat || !u.lng) continue;
          if (isNaN(u.lat) || isNaN(u.lng)) continue;
          if (u.lat === 0 && u.lng === 0 && !u.timestamp) continue;
          const isOffline = u._offline || (Date.now() - (u.timestamp || 0) > STALE_THRESHOLD_MS);
          riders.push({
            id: uid,
            lat: u.lat,
            lng: u.lng,
            name: u.userName || 'Rider',
            color: u.color || '#888',
            status: u.status || '🟢',
            isYou: false,
            isActive: !isOffline && u.isTracking,
            speed: u.speed || 0
          });
        }

        if (riders.length === 0) {
          for (const m of clusterMarkers) m.remove();
          clusterMarkers = [];
          return;
        }

        const clusters = getClusters(riders);

        for (const m of clusterMarkers) m.remove();
        clusterMarkers = [];

        for (const cluster of clusters) {
          const isCluster = cluster.riders.length > 1;
          const emoji = isCluster ? '🚴🚴' : '🚴';
          const color = isCluster ? '#ffd93d' : cluster.riders[0].color;

          const el = document.createElement('div');
          el.className = 'custom-marker' + (isCluster ? ' cluster-marker' : '');
          el.style.backgroundColor = color;
          el.textContent = emoji;
          if (isCluster) el.style.color = '#000';

          const marker = new maplibregl.Marker({ element: el, anchor: 'center' })
            .setLngLat([cluster.lng, cluster.lat])
            .addTo(map);

          let popupHTML = '';
          for (const r of cluster.riders) {
            popupHTML += `<b>${escapeHtml(r.name)}</b> ${r.status || '🟢'}<br>`;
          }
          if (isCluster) {
            popupHTML +=
              `<span style="font-size:0.7rem;color:var(--text-secondary);">${cluster.riders.length} riders together</span>`;
          } else {
            const r = cluster.riders[0];
            popupHTML += `Speed: ${(r.speed || 0).toFixed(1)} km/h`;
          }

          const popup = new maplibregl.Popup({ offset: [0, -15] }).setHTML(popupHTML);
          marker.setPopup(popup);

          clusterMarkers.push(marker);
        }
      }

      // ============================================================
      // UPDATE MY MARKER
      // ============================================================

        if (!myLastPosition || !map || !mapInitialized) return;
        const { lat, lng } = myLastPosition;

      function kickUser(userId, userName) {

        const codeRef = database.ref('teamCodes').orderByChild('teamCode').equalTo(teamCode);

      // ===== GPX PARSING =====
      function parseGPX(gpxString) {
        const parser = new DOMParser();
        const xml = parser.parseFromString(gpxString, 'text/xml');
        const points = [];

        let trkpts = xml.getElementsByTagName('trkpt');
        if (trkpts.length === 0) {
          trkpts = xml.getElementsByTagName('rtept');
        }
        if (trkpts.length === 0) {
          trkpts = xml.getElementsByTagName('wpt');
        }

        for (let i = 0; i < trkpts.length; i++) {
          const lat = parseFloat(trkpts[i].getAttribute('lat'));
          const lon = parseFloat(trkpts[i].getAttribute('lon'));
          if (!isNaN(lat) && !isNaN(lon)) {
            points.push([lat, lon]);
          }
        }

        if (points.length === 0) {
          const segments = xml.getElementsByTagName('trkseg');
          for (let s = 0; s < segments.length; s++) {
            const pts = segments[s].getElementsByTagName('trkpt');
            for (let i = 0; i < pts.length; i++) {
              const lat = parseFloat(pts[i].getAttribute('lat'));
              const lon = parseFloat(pts[i].getAttribute('lon'));
              if (!isNaN(lat) && !isNaN(lon)) {
                points.push([lat, lon]);
              }
            }
          }
        }

        return points;
      }

      // ============================================================
      // 🔥 FIXED: ROUTE UPLOAD – now with better error handling
      // ============================================================
      function uploadRoute(file) {
        if (!file) {
          showToast('Please select a GPX file.', true);
          return;
        }
        if (teamCode === 'openworld') {
          showToast('Routes are not available in Open World.', true);
          return;
        }

        showToast('⏳ Uploading route...', false);

        const reader = new FileReader();
        reader.onload = function(e) {
          try {
            const gpxText = e.target.result;
            const points = parseGPX(gpxText);

            if (points.length < 2) {
              showToast('Invalid GPX file or no track points. Found: ' + points.length + ' points.', true);
              return;
            }

            const routesRef = database.ref('teams/' + teamCode + '/savedRoutes');
            routesRef.once('value').then((snap) => {
              if (snap.numChildren() >= 5) {
                showToast('⚠️ Maximum 5 routes per team. Delete an existing route first.', true);
                return;
              }

              const routeRef = routesRef.push();
              const routeName = file.name.replace(/\.[^/.]+$/, "") || 'Unnamed Route';

              routeRef.set({
                name: routeName,
                points: points,
                createdAt: Date.now()
              }).then(() => {
                showToast('✅ Route "' + routeName + '" uploaded!');
                // Activate this route
                database.ref('teams/' + teamCode + '/activeRouteId').set(routeRef.key)
                  .then(() => {
                    showToast('🗺️ Route activated on map!');
                    updateTeamActivity();
                  })
                  .catch((err) => {
                    showToast('⚠️ Route saved but activation failed: ' + err.message, true);
                  });
                renderRouteDropdown();
                renderRouteList();

                // Clear the file input so the user can upload the same file again
                const fileInput = document.getElementById('gpxFileInput');
                if (fileInput) fileInput.value = '';
              }).catch((err) => {
                showToast('❌ Upload failed: ' + err.message, true);
              });
            });
          } catch (err) {
            showToast('❌ Error parsing GPX: ' + err.message, true);
          }
        };

        reader.onerror = function() {
          showToast('❌ Failed to read file.', true);
        };

        reader.readAsText(file);
      }

      // SET START POINT (manual leader set)
      // ============================================================
      function setStartPoint() {
        if (!isLeader) {
          showToast('Only the leader can set the start point.', true);
          return;

        if (!activeRouteId) {
          showToast('Please select a route first.', true);
          return;

        database.ref('teams/' + teamCode + '/savedRoutes/' + activeRouteId).once('value').then((snap) => {
          const route = snap.val();
          if (!route || !route.points || route.points.length === 0) {
            showToast('Route has no points.', true);
            return;
          }
          const firstPoint = route.points[0];
          const startData = { lat: firstPoint[0], lng: firstPoint[1] };
          database.ref('teams/' + teamCode + '/startPoint').set(startData)
            .then(() => {
              showToast('🏁 Start point set at the beginning of the route (manual).');
              myLastPosition = {
                lat: firstPoint[0],
                lng: firstPoint[1],
                speed: 0,
                heading: null,
                altitude: null,
                timestamp: Date.now()
              };
              updateMyMarker();
              map.setCenter([firstPoint[1], firstPoint[0]]);
              map.setZoom(16);
              broadcastMyPosition();
              updateTeamActivity();
              showToast('📍 Your bike marker is now at the start point.');
            })
            .catch((err) => {
              showToast('❌ Failed to set start point: ' + err.message, true);

          .then(() => {

        if (isLeader && teamCode !== 'openworld') {
